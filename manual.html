<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>DoTo Manual</title>
<meta name="description" content="DoTo user manual: views, tasks, shortcuts, import/export, installing and FAQ." />
<meta name="theme-color" content="#1a73e8" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="apple-touch-icon" href="icon-180.png" />
<style>
:root{color-scheme:light;--blue:#1a73e8;--bg:#fff;--bg2:#f6f8fc;--text:#202124;--muted:#5f6368;--line:#dadce0;--line-soft:#e6eaf0}
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.6}
header.top{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line-soft);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:10}
header.top a.back{color:var(--blue);text-decoration:none;font-weight:500}
header.top .spacer{flex:1}
article{max-width:760px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:28px;margin:.4em 0}
h2{font-size:21px;margin:1.6em 0 .4em;padding-top:.4em;border-top:1px solid var(--line-soft)}
blockquote{margin:1em 0;padding:10px 16px;background:var(--bg2);border-left:4px solid var(--blue);border-radius:0 10px 10px 0;color:var(--muted)}
blockquote p{margin:.3em 0}
table{width:100%;border-collapse:collapse;margin:1em 0;font-size:14px;display:block;overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{color:var(--muted);font-weight:500}
td:last-child{white-space:normal}
code{font-family:Consolas,monospace;font-size:.88em;background:var(--bg2);border:1px solid var(--line-soft);border-radius:6px;padding:1px 6px}
a{color:var(--blue)}
ul{padding-left:22px}
li{margin:.3em 0}
.err{color:var(--muted);padding:40px 0;text-align:center}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="./">← DoTo app</a>
  <span class="spacer"></span>
  <a class="back" href="MANUAL.md">Markdown source</a>
</header>
<article id="doc"><p class="err">Loading manual…</p></article>
<script>
'use strict';
const slug = (s) => s.toLowerCase().trim().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
}
function render(md) {
  const lines = md.split('\n');
  let html = '', i = 0, inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  while (i < lines.length) {
    const line = lines[i];
    if (/^#{1,3}\s/.test(line)) {
      closeList();
      const lvl = line.match(/^#+/)[0].length, text = line.replace(/^#+\s*/, '');
      html += `<h${lvl} id="${slug(text)}">${inline(text)}</h${lvl}>`;
    } else if (/^\s*>\s?/.test(line)) {
      closeList();
      const qs = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) qs.push(lines[i].replace(/^\s*>\s?/, '')), i++;
      html += '<blockquote>' + qs.map((q) => `<p>${inline(q)}</p>`).join('') + '</blockquote>';
      continue;
    } else if (/^\|.*\|$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|$/.test(lines[i + 1])) {
      closeList();
      const cells = (r) => r.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      html += '<table><thead><tr>' + cells(line).map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && /^\|.*\|$/.test(lines[i])) {
        html += '<tr>' + cells(lines[i]).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>';
        i++;
      }
      html += '</tbody></table>';
      continue;
    } else if (/^\s*-\s+/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(line.replace(/^\s*-\s+/, ''))}</li>`;
    } else if (!line.trim()) {
      closeList();
    } else {
      closeList();
      html += `<p>${inline(line)}</p>`;
    }
    i++;
  }
  closeList();
  return html;
}
fetch('MANUAL.md')
  .then((r) => { if (!r.ok) throw 0; return r.text(); })
  .then((md) => { document.getElementById('doc').innerHTML = render(md); })
  .catch(() => {
    document.getElementById('doc').innerHTML =
      '<p class="err">Could not load MANUAL.md (open this page over http, or read ' +
      '<a href="https://github.com/arazgray/doto/blob/main/MANUAL.md">MANUAL.md on GitHub</a>).</p>';
  });
</script>
</body>
</html>
